[pytest]
markers =
    unit: tests that do not require PostgreSQL
    pg: PostgreSQL data-path integration tests
    schema_mutation: tests that alter schema, indexes, constraints, or migrations
    concurrency: tests using multiple connections or threads
    subprocess: tests that create child processes
    e2e: broad production-path integration tests
    slow: intentionally expensive tests
    serial: tests that must not overlap across workers
    rollback_isolation: opt-in per-test txn rollback on one shared per-worker schema (Step 5.4)
