trading_mode:
  live_trading_enabled: false
  paper_trading_enabled: true
  real_order_api_enabled: false
  allow_withdraw_api: false
  allow_trade_api: false
  require_public_market_data_only: true

# Phase B (07-07): LLM retry + circuit breaker configuration.
# When llm.retry.enabled=false, the wrapper does a single attempt + fail-closed
# (pre-task behavior). When llm.circuit_breaker.enabled=false, the breaker
# is a no-op (_NullBreaker). Operators can disable retry/breaker without code
# changes if scheduler latency becomes unacceptable.
llm:
  retry:
    enabled: true
    max_attempts_per_symbol: 3
    max_batch_retry_calls: 9
    batch_wall_clock_budget_seconds: 90   # PRIMARY scheduler safeguard (60-180s range)
    strict_json_attempt: 2
    minimal_safe_attempt: 3
    jitter_seconds_min: 2
    jitter_seconds_max: 20
  circuit_breaker:
    enabled: true
    consecutive_failures: 3
    rate_threshold: 0.5
    rate_window: 10
    # 07-09-overtrigger P0-3: rate-based open only fires when at least
    # ``min_rate_samples`` observations exist in the rate window. Pre-fix,
    # 3 calls with 2 failures (67%) opened the breaker and skipped the
    # remaining 7-8 symbols of a 10-symbol batch. With min_rate_samples=5,
    # the first [fail, fail, success] sequence leaves the breaker closed
    # so the rest of the batch is actually evaluated. llm_config_error
    # still opens immediately regardless of sample count.
    min_rate_samples: 5
  # --------------------------------------------------------------------
  # 07-10 LLM Fair Scheduling + Context Continuity.
  # ``scheduling`` replaces the fixed ``ESTIMATED_CALL_MS=30_000`` admission
  # gate (which starved the last 7 of 10 symbols under a shared 90s budget)
  # with a PER-SYMBOL deadline. Each symbol gets its own bounded wall-clock
  # window (call + retry + jitter + parse + validate); the shared batch
  # budget no longer lets the first few symbols drain the pool for everyone.
  # The fair scheduler (Phase C) runs Attempt 1 for every eligible symbol
  # concurrently (bounded by ``max_concurrency``) with deterministic
  # rotation, so no symbol is permanently starved by alphabetical order.
  # ``generation`` bounds the prompt, output tokens, thinking budget, and
  # temperature for structured JSON synthesis (no unbounded adaptive
  # thinking). Validation lives in ``config/loader.py``.
  # --------------------------------------------------------------------
  scheduling:
    # ``fair_pool`` = bounded concurrent executor with two-pass barriers
    # (Phase C). ``legacy_serial`` is reserved for the rollback flag; the
    # fallback MUST be deterministic-only, never the known-starving path.
    mode: fair_pool
    # Provider-call concurrency cap. Range 1..4. Higher values may trigger
    # provider rate limits; the default 4 keeps a 10-symbol batch inside
    # one 15-minute scheduler tick at P95 35s latency.
    max_concurrency: 4
    # Per-symbol end-to-end deadline (Attempt 1 + retries + jitter + parse
    # + validate). Valid range 180..1200 seconds. 300s (5 min) lets a slow
    # P95-35s symbol complete up to 3 attempts with jitter; the fair
    # scheduler guarantees every symbol gets a first attempt before any
    # symbol gets a second.
    per_symbol_timeout_seconds: 300
    # Per-attempt provider-call timeout. Must be <= per_symbol_timeout.
    # The provider call for each attempt is bounded by
    # min(per_attempt_timeout_seconds, remaining_per_symbol_seconds).
    per_attempt_timeout_seconds: 180
    # Guard subtracted from the scheduler interval to compute the effective
    # batch deadline; must be positive and smaller than the scheduler
    # interval so the batch finishes inside one tick.
    batch_completion_guard_seconds: 60
    # Deterministic batch-derived rotation offset so no symbol is
    # permanently first/last by alphabetical order. ``true`` rotates by
    # stable_hash(batch_id) % len(symbols).
    rotate_start_symbol: true
  generation:
    # Hard prompt cap. Mandatory core > max_prompt_bytes => fail-closed
    # with ``prompt_budget_contract_violation`` (no provider call).
    max_prompt_bytes: 49152
    # Target prompt size; optional sections are trimmed to reach it.
    target_prompt_bytes: 32768
    # Explicit output token limit for structured JSON synthesis. Replaces
    # the unbounded adaptive-thinking path.
    # 07-13 R6-D (P0-3.2): raised from 4096 to 8192 so structured JSON has a
    # non-empty answer reserve after the thinking budget. The pre-fix value
    # (4096) was <= thinking_budget_tokens (6000), so the model spent the
    # entire output budget on thinking and truncated the structured answer
    # at exactly 4096 tokens (stop_reason=max_tokens).
    max_output_tokens: 8192
    # Explicit thinking budget (tokens). 0 = extended thinking disabled.
    # 07-13 R6-D (P0-3.2): lowered from 6000 to 2048 so it is strictly less than
    # max_output_tokens (8192), leaving a >= 6144-token structured-JSON
    # reserve. ``_resolve_generation_config`` / the config loader reject a
    # generation pair whose remaining structured-answer reserve
    # (``max_output_tokens - thinking_budget_tokens``) is below
    # ``min_structured_answer_tokens`` (and reject ``thinking >= max_output``
    # outright), so this conflict cannot silently recur. Per plan P0-3 item 1
    # and AC6: the structured-JSON reserve MUST stay at or above the configured
    # minimum.
    thinking_budget_tokens: 2048
    # 07-13 R7 (P1-1): minimum structured-JSON answer reserve (tokens). When
    # extended thinking is enabled (``thinking_budget_tokens > 0``), the loader
    # rejects any pair where ``max_output_tokens - thinking_budget_tokens <
    # min_structured_answer_tokens``. Production 8192/2048 leaves a 6144-token
    # reserve, well above this floor. Plan ref: production-incident-repair-plan-
    # 07-13.md §4 P0-3 item 1 + AC6.
    min_structured_answer_tokens: 4096
    # Low temperature for deterministic structured JSON output.
    temperature: 0.2

analysis:
  mode: intraday
  timeframes:
    direction: "4h"
    trend: ["1h", "15m"]
    entry: "5m"
  weights:
    4h: 0.35
    1h: 0.25
    15m: 0.20
    5m: 0.20
  require_closed_htf_candles: true

risk:
  min_rr: 1.5
  min_confidence_for_paper_order: 0.72
  min_confidence: 0.72
  require_structure_momentum_alignment: true
  allow_manual_bypass: false
  min_sl_distance_pct: 0.8  # 止损距离至少占入场价的0.8%
  min_tp_distance_pct: 1.0  # 第一止盈距离至少占入场价的1.0%
  # BTC#9 fix: LLM failed/disabled fallback 不得直接创建模拟盘订单
  fallback_llm_failed_blocks_paper_order: true
  # BTC#9 fix: 缺少 entry_trigger_confirmation 不得直接创建模拟盘订单
  require_entry_confirmation_for_paper_order: true
  # BTC#9 fix: invalid_condition 价与 stop_loss 之间最小缓冲（比例 0-1，0.3=30% 从 stop 向 entry）
  invalid_condition_buffer_ratio: 0.3
  # BTC#9 P2-1: HTF weak structure fail-closed — 多周期结构偏弱需更强入场确认
  require_stronger_confirmation_for_weak_structure: true

# Phase B (07-03): structured market-semantic normalization.
# Single source of truth for bias+stage contract, HTF-conflict confidence cap,
# and grade downgrade rules. The cap must be < MIN_CONFIDENCE_FOR_PAPER_ORDER
# (0.72) so countertrend rebounds cannot reach the execution gate.
market_semantics:
  htf_conflict_confidence_cap: 0.70
  enforce_bias_stage_contract: true
  allowed_stages_for_neutral_bias: ["range", "transition", "unknown"]
  allowed_stages_for_mixed_bias: ["range", "transition", "unknown"]
  allowed_stages_for_unknown_bias: ["range", "transition", "unknown"]
  # When htf_conflict=True, downgrade S/A grades one tier; B stays B.
  grade_downgrade_map:
    S: "A"
    A: "B"
    B: "B"
    C: "C"
    D: "D"

# BTC#9 fix: pending 订单 fill 前复核最新 GA + K 线健康
pending_order_revalidation:
  enabled: true
  require_healthy_kline_for_limit: true
  unhealthy_kline_wick_ratio: 2.0  # (high-low) > ratio * abs(close-open) 视为插针
  # BTC#9 P0-2: structured candle confirmation for limit orders (per-candle close validation)
  require_structured_candle_confirmation: true
  require_close_hold_entry_zone: true
  max_adverse_penetration_r: 0.5  # (entry-close)/(entry-stop) must be <= 0.5 for fill
  max_candles_per_batch: 1500  # max candles to process per cycle for downtime recovery (R3-G: 3+ pages)
  # C5: paged backfill — per-page fetch size and max pages per batch
  max_candles_per_page: 500
  max_pages_per_batch: 10
  # P0-4: third fail-closed gate — assess_health before create_paper_trade.
  # When true, fill_order_if_triggered calls assess_health and refuses to
  # fill if the market data is not ready. Set to false only for isolated
  # unit tests that need to bypass the data-health gate.
  require_market_data_health_for_fill: true

account_risk:
  drawdown_risk_off_threshold: -2.5   # %
  drawdown_hard_risk_off_threshold: -3.0  # % — 禁止所有新开仓
  risk_off_risk_percent: 0.25         # 降低后的单笔风险
  recovery_min_avg_r: 0.0
  recovery_max_loss_count: 4
  recovery_lookback: 10               # 最近 N 笔
  recovery_wait_hours: 24             # 距离上次亏损等待小时数
  daily_loss_pause_consecutive_losses: 2  # 连续止损笔数触发暂停
  daily_loss_pause_avg_r_threshold: -0.5  # 当日 avg_r 触发暂停
  cooldown_symbols:
    BTCUSDT_LONG: 48                   # 小时
    LTCUSDT_LONG: 48
    ETHUSDT_LONG: 48
    BNBUSDT_SHORT: 48

paper_trading:
  price_update_interval_minutes: 3
  unrealized_pnl_price_source: "latest_price"
  market_fill_method: "next_candle_open_with_slippage"
  market_slippage_pct: 0.001
  limit_fill_method: "entry_price_between_high_low"
  limit_order_slippage_pct: 0.0

feishu:
  hourly_summary_enabled: true
  use_rich_card_summary: true
  quiet_period:
    normal_duplicate_alert_minutes: 5
    suppress_add_position_alerts: true
    never_silence:
      - open_position
      - close_position
      - stop_loss_adjustment
      - take_profit_hit
      - stop_loss_hit
      - risk_alert
      # 08-04 contract A: the watch-lifecycle alert_type is removed here —
      # watch lifecycle is internal-only, stays silenceable.
      - paper_order_filled
      - paper_order_expired
      - conflict_cancelled
      - evolution_trigger

alerts:
  retry_enabled: true
  retry_max_attempts: 3
  retry_backoff: "exponential"
  store_failed_alerts: true

evolution:
  shadow_testing_enabled: true
  allow_double_llm_cost: true
  min_observation_signals: 3
  preferred_promotion_sample_size: 30
  affected_strategy_observation_hours: 24
  auto_promote: false
  allow_auto_promote_to_candidate: false
  pause_evolution_on_extreme_market: true
  online_shadow:
    min_samples_after_backtest: 5
    min_samples_without_backtest: 30
  stale_cleanup:
    max_days: 7
    min_samples: 3
  trigger:
    consecutive_stop_losses: 3
    max_account_drawdown_pct: 0.10
  backtest_gate:
    enabled: true
    lookback_days: 60
    min_simulated_trades: 30
    min_decision_samples: 80
    min_avg_r_improvement: 0.05
    max_win_rate_degradation: 0.10
    max_drawdown_increase: 0.20
    min_r_count_for_performance_gate: 5

account_feedback_rules:
  enabled: true
  mode: shadow
  lookback_hours: 24
  affected_scope: trigger_related_symbols
  actions:
    require_stronger_confirmation:
      enabled: true
      min_confidence: 0.80
      min_entry_quality: 0.70
      on_fail: annotate_only

market_regime:
  enabled: true
  mode: shadow
  weight: 0.25
  btc_weight: 0.10
  eth_weight: 0.05
  breadth_weight: 0.05
  volatility_weight: 0.05
  counter_regime:
    confidence_penalty: 0.10
    grade_downgrade: 1
    risk_multiplier: 0.5
    min_rr: 2.0
    allow_order_types: ["trigger", "retest"]
    watch_only_after_same_side_losses: 2
  require_stronger_confirmation:
    min_confidence: 0.80
    min_entry_quality: 0.70
  independent_trend:
    min_relative_strength_pct: 1.0
    min_confirmations: 2
    allow_bypass: true

risk_language:
  banned_phrases:
    - "一定上涨"
    - "必涨"
    - "稳赚"
    - "放心持有"
    - "强烈开多"
    - "强烈开空"
  required_disclaimer: "不构成实盘建议，仅用于模拟盘与策略研究。"

performance_gate:
  enabled: true
  cooldown:
    loss_count_threshold: 2
    loss_window: 3
    cooldown_hours: 24
  confidence_degradation:
    avg_r_threshold: -0.2
    sample_window: 5
    confidence_penalty: 0.10
  context_performance:
    min_samples: 3
    avg_r_threshold: 0.0
    downgrade_rules:
      S: "A"
      A: "B"
      B: "C"
      C: "D"
      D: "D"

position_conflict:
  enabled: true
  mode: controlled
  min_confidence:
    S: 0.85
    A: 0.78
    B: 0.72
  strong_conflict_confirmations: 2
  early_exit_min_adverse_r: -0.30
  signal_decay_exit_threshold: 0.70
  breakeven_on_conflict_if_mfe_r: 0.10
  notify_actions: true
  # P0-4: Unified breakeven gates (used by both conflict and routine paths)
  min_hold_minutes: 15
  min_current_r_for_breakeven: 0.50
  min_mfe_r_for_breakeven: 0.75
  reverse_confirmations_for_tighten: 2
  # P0: Profit protection — close profitable positions on strong reverse signals
  profit_protection:
    enabled: true
    min_grade: "S"
    min_confidence: 0.85
    min_mfe_r: 1.00
    min_current_r: 0.30
    min_retracement_r: 0.50
    action: "close_full"
